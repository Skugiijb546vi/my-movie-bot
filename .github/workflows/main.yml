name: Movie Bot Auto Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # لێرەدا پایتۆنەکەمان تازە کردەوە بۆ ئەوەی ئاگادارییەکە نەمێنێت
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin deep-translator # لێرەدا وەرگێڕەکەمان پێ دابەزاند
          
      - name: Run bot
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python bot.py
