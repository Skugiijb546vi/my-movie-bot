name: Movie Bot Auto Sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install firebase-admin requests
      - name: Run Bot
        run: python bot.py
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
